name: Elan Blog to Threads

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 블로그 새 글 확인
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write  # state.json 커밋

concurrency:
  group: elan-threads
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check blog and post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.ELAN_THREADS_ACCESS_TOKEN }}
          TEST_MODE: "False"
        run: python elan_poster.py

      - name: Commit updated state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore: update state.json [skip ci]"
            git pull --rebase -q
            git push
          else
            echo "state.json 변경 없음"
          fi
